{% extends "base.html" %}

{% block title %}Nuevo horario &middot; Growth Horizon{% endblock %}
{% block cabecera %}Configurar horario{% endblock %}
{% block subcabecera %}Indica el día y el rango de horas de atención.{% endblock %}

{% block contenido %}
    <div class="max-w-xl bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <form method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-1.5 text-slate-700">Día de la semana *</label>
                <select name="dia" required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm">
                    {% for nombre, numero in DIAS_SEMANA %}
                        <option value="{{ nombre }}">{{ nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-700">Apertura</label>
                    <input type="time" name="apertura" value="09:00" required
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-700">Cierre</label>
                    <input type="time" name="cierre" value="18:00" required
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm">
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 pt-2 border-t border-slate-100">
                <a href="{{ url_for('cliente.horarios_listar') }}"
                   class="px-5 py-2.5 rounded-lg border border-slate-300 text-sm font-medium hover:bg-slate-50 transition">Cancelar</a>
                <button type="submit"
                        class="px-5 py-2.5 rounded-lg bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-900 text-sm font-semibold hover:opacity-90 transition">
                    Guardar horario
                </button>
            </div>
        </form>
    </div>
{% endblock %}
