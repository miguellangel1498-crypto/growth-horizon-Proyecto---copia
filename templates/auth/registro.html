<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta &middot; Growth Horizon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased">

    <div class="min-h-full grid place-items-center px-6 py-12">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center space-y-2">
                <div class="mx-auto w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-emerald-500 flex items-center justify-center text-xl font-black text-slate-900">GH</div>
                <h1 class="text-2xl font-bold text-white">Crear cuenta</h1>
                <p class="text-sm text-slate-500">El primer usuario registrado obtiene rol de administrador.</p>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-5">
                {% with mensajes = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensaje in mensajes %}
                        <div class="px-4 py-3 rounded-lg text-sm font-medium border
                            {% if categoria == 'error' %}bg-red-500/10 text-red-300 border-red-800
                            {% elif categoria == 'success' %}bg-emerald-500/10 text-emerald-300 border-emerald-800
                            {% else %}bg-sky-500/10 text-sky-300 border-sky-800{% endif %}">
                            {{ mensaje }}
                        </div>
                    {% endfor %}
                {% endwith %}

                <form method="post" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-1.5 text-slate-300">Nombre completo</label>
                        <input type="text" name="nombre" required autofocus
                               class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                               placeholder="Juan Pérez">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5 text-slate-300">Correo electrónico</label>
                        <input type="email" name="email" required
                               class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                               placeholder="nombre@empresa.com">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-300">Contraseña</label>
                            <input type="password" name="password" required minlength="8"
                                   class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                                   placeholder="Mínimo 8 caracteres">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5 text-slate-300">Confirmar</label>
                            <input type="password" name="confirmar_password" required minlength="8"
                                   class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm"
                                   placeholder="Repetir contraseña">
                        </div>
                    </div>
                    <button type="submit"
                            class="w-full py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-emerald-500 text-slate-900 font-semibold hover:opacity-90 transition">
                        Crear cuenta
                    </button>
                </form>
            </div>

            <p class="text-center text-sm">
                ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" class="text-cyan-400 hover:text-cyan-300">Inicia sesión</a>
            </p>
        </div>
    </div>
</body>
</html>
